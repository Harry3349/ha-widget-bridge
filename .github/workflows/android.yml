name: Android-Build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

jobs:
  apk:
    name: Debug-APK bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Ohne festen Schlüssel erzeugt jeder CI-Lauf einen neuen Debug-Schlüssel –
      # Android würde Updates dann mit INSTALL_FAILED_UPDATE_INCOMPATIBLE ablehnen.
      - name: Debug-Keystore wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Gradle-Wrapper erzeugen
        working-directory: android
        run: gradle --no-daemon wrapper --gradle-version 8.9

      - name: APK bauen
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :wear:assembleDebug

      - name: APK hochladen (Handy)
        uses: actions/upload-artifact@v4
        with:
          name: HAWidgetBridge-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK hochladen (Uhr)
        uses: actions/upload-artifact@v4
        with:
          name: HAWidgetBridge-wear-debug
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
